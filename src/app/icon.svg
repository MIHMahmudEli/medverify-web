<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#0d5c75" />
      <stop offset="100%" stop-color="#1e3a5f" />
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield -->
  <path d="M32 4L54 13.5V31C54 44.5 44.5 55.5 32 60C19.5 55.5 10 44.5 10 31V13.5L32 4Z" 
        fill="url(#shieldGrad)" 
        filter="url(#shadow)" />

  <!-- Inner Stroke Highlight -->
  <path d="M32 6.5L51.5 15V31C51.5 43 43 53 32 57.2C21 53 12.5 43 12.5 31V15L32 6.5Z" 
        stroke="rgba(255,255,255,0.25)" 
        stroke-width="1.5" 
        fill="none" />

  <!-- Medical Cross Graphic -->
  <rect x="29" y="16" width="6" height="20" rx="2" fill="#ffffff" opacity="0.95" />
  <rect x="22" y="23" width="20" height="6" rx="2" fill="#ffffff" opacity="0.95" />

  <!-- Verification Checkmark Disc in Foreground -->
  <circle cx="42" cy="42" r="13" fill="#ffffff" filter="url(#shadow)" />
  <circle cx="42" cy="42" r="11" fill="url(#checkGrad)" />
  <path d="M37 42L40.5 45.5L47.5 38.5" 
        stroke="#ffffff" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
</svg>
